<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F3F0E8" id="themeColorMeta" />
    <title>404 - Halaman Tidak Ditemukan | CTFY</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
        (function () {
            try {
                if (localStorage.getItem('ctfy_theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    var meta = document.getElementById('themeColorMeta');
                    if (meta) meta.setAttribute('content', '#191917');
                }
            } catch (e) {}
        })();
    </script>
    <script>
        // Static-host SPA fallback: only redirect known legacy SPA paths to query params
        (function () {
            try {
                var rawPath = window.location.pathname || '/';
                var normPath = rawPath.replace(/\/index\.html$/i, '');
                if (normPath.length > 1) normPath = normPath.replace(/\/+$/, '');
                var params = new URLSearchParams(window.location.search || '');
                var target = null;

                if (/^\/(?:library|semua|presets)$/i.test(normPath)) {
                    if (!params.has('tab')) params.set('tab', 'library');
                    target = '/?' + params.toString();
                } else if (/^\/(?:tools|alat|analyzer)$/i.test(normPath)) {
                    if (!params.has('tab')) params.set('tab', 'tools');
                    target = '/?' + params.toString();
                } else if (/^\/(?:tentang|about)$/i.test(normPath)) {
                    if (!params.has('tab')) params.set('tab', 'tentang');
                    target = '/?' + params.toString();
                } else if (/^\/(?:dukung|support|donasi)$/i.test(normPath)) {
                    if (!params.has('tab')) params.set('tab', 'dukung');
                    target = '/?' + params.toString();
                } else if (/^\/(?:platform|home|beranda)$/i.test(normPath)) {
                    if (!params.has('tab')) params.set('tab', 'platform');
                    target = '/?' + params.toString();
                } else {
                    var mLib = normPath.match(/^\/(?:library|semua|presets)\/([^\/?#]+)$/i);
                    var mPlat = normPath.match(/^\/platform\/([^\/?#]+)$/i);
                    var mTool = normPath.match(/^\/(?:tools|alat)\/(finder|link-finder|tiktok-finder|analyzer|video-analyzer)$/i);
                    if (mLib) {
                        params.set('tab', 'library');
                        params.set('code', decodeURIComponent(mLib[1]));
                        target = '/?' + params.toString();
                    } else if (mPlat) {
                        params.set('tab', 'platform');
                        params.set('code', decodeURIComponent(mPlat[1]));
                        target = '/?' + params.toString();
                    } else if (mTool) {
                        params.set('tab', 'tools');
                        params.set('tool', /finder/i.test(mTool[1]) ? 'finder' : 'analyzer');
                        target = '/?' + params.toString();
                    }
                }

                if (target) {
                    window.location.replace(target + (window.location.hash || ''));
                }
            } catch (e) {}
        })();
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #F3F0E8;
            --surface: #FFFFFF;
            --muted: #EAE6DC;
            --text: #262521;
            --text-secondary: #77736B;
            --accent: #B85D3B;
            --accent-hover: #9E4B2D;
            --accent-soft: rgba(184, 93, 59, 0.12);
            --border: #E3DED3;
        }
        [data-theme="dark"] {
            --bg: #191917;
            --surface: #252522;
            --muted: #2F2E2A;
            --text: #EEECE5;
            --text-secondary: #A7A398;
            --accent: #D17A5B;
            --accent-hover: #DF8B6D;
            --accent-soft: rgba(209, 122, 91, 0.14);
            --border: #393832;
        }
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            line-height: 1.55;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px 24px;
            text-align: left;
            box-shadow: 0 12px 32px -12px rgba(38, 37, 33, 0.12);
        }
        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
            color: var(--text);
        }
        .brand-mark {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            background: var(--accent);
        }
        .code-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid rgba(184, 93, 59, 0.25);
            padding: 3px 9px;
            border-radius: 6px;
        }
        h1 {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 3.1rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            color: var(--text);
            margin-bottom: 10px;
        }
        h2 {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text);
        }
        p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.86rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
        }
        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .primary {
            grid-column: 1 / -1;
            background: var(--accent);
            color: #FFFFFF;
        }
        .primary:hover { background: var(--accent-hover); }
        .secondary {
            background: var(--muted);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand-row">
            <span class="brand"><span class="brand-mark" aria-hidden="true"></span>CTFY</span>
            <span class="code-tag">HTTP 404</span>
        </div>
        <h1>404</h1>
        <h2>Halaman Tidak Ditemukan</h2>
        <p>Alamat yang kamu buka tidak tersedia atau sudah dipindahkan. Kembali ke beranda atau jelajahi preset dan tools CTFY.</p>
        <div class="actions">
            <a class="primary" href="/">Kembali ke Beranda</a>
            <a class="secondary" href="/?tab=library">Library Asset</a>
            <a class="secondary" href="/?tab=tools">Tools TikTok</a>
        </div>
    </main>
</body>
</html>
